<svg xmlns="http://www.w3.org/2000/svg" width="370" height="308" viewBox="0 0 370 308" role="img" aria-labelledby="title desc">
  <title id="title">Representation diagnostics</title>
  <desc id="desc">Subspace overlap across ranks 1, 2, 4, 8, 16, 32, and 64 for Copper World tokens and the variant without joint-embedding prediction, with a random-expectation baseline. Below, action probe R-squared is 0.787 without prediction, 0.802 for World tokens, 0.910 for current-frame tokens, and 0.927 for both channels together.</desc>
  <!-- The seven curve vertices trace the original raster panel; the probe values are from the adjoining results table. -->
  <rect width="370" height="308" fill="#fff"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#111">
    <text x="185" y="20" text-anchor="middle" font-size="16">Representation diagnostics</text>
    <g stroke="#d7d7d7" stroke-width=".8">
      <line x1="55" y1="46" x2="340" y2="46"/>
      <line x1="55" y1="98" x2="340" y2="98"/>
      <line x1="55" y1="151" x2="340" y2="151"/>
    </g>
    <g stroke="#111" stroke-width="1.1" fill="none">
      <line x1="55" y1="40" x2="55" y2="151"/>
      <line x1="55" y1="151" x2="340" y2="151"/>
    </g>
    <text x="18" y="100" transform="rotate(-90 18 100)" text-anchor="middle" font-size="12">Subspace overlap ↓</text>
    <g font-size="10" text-anchor="end">
      <text x="48" y="49">1.0</text><text x="48" y="101">0.5</text><text x="48" y="154">0.0</text>
    </g>
    <g font-size="10" text-anchor="middle">
      <text x="66" y="166">1</text><text x="110" y="166">2</text><text x="154" y="166">4</text><text x="198" y="166">8</text><text x="242" y="166">16</text><text x="286" y="166">32</text><text x="330" y="166">64</text>
    </g>
    <line x1="55" y1="148.8" x2="340" y2="148.8" stroke="#777" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="218" y="141" font-size="9" fill="#777">random expectation</text>
    <polyline points="66,80 110,98 154,90 198,67 242,59 286,62 330,64" fill="none" stroke="#d95c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="66,144 110,144 154,139 198,131 242,119 286,102 330,87" fill="none" stroke="#087db6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#d95c00">
      <rect x="62.5" y="76.5" width="7" height="7"/><rect x="106.5" y="94.5" width="7" height="7"/><rect x="150.5" y="86.5" width="7" height="7"/><rect x="194.5" y="63.5" width="7" height="7"/><rect x="238.5" y="55.5" width="7" height="7"/><rect x="282.5" y="58.5" width="7" height="7"/><rect x="326.5" y="60.5" width="7" height="7"/>
    </g>
    <g fill="#087db6">
      <circle cx="66" cy="144" r="3.6"/><circle cx="110" cy="144" r="3.6"/><circle cx="154" cy="139" r="3.6"/><circle cx="198" cy="131" r="3.6"/><circle cx="242" cy="119" r="3.6"/><circle cx="286" cy="102" r="3.6"/><circle cx="330" cy="87" r="3.6"/>
    </g>
    <text x="72" y="70" font-size="10" fill="#b64b00">z_t w/o JE Pred.</text>
    <text x="72" y="131" font-size="10" fill="#006c9f">z_t</text>
    <g stroke="#d7d7d7" stroke-width=".8">
      <line x1="55" y1="180" x2="340" y2="180"/>
      <line x1="55" y1="232" x2="340" y2="232"/>
      <line x1="55" y1="284" x2="340" y2="284"/>
    </g>
    <g stroke="#111" stroke-width="1.1" fill="none">
      <line x1="55" y1="178" x2="55" y2="284"/>
      <line x1="55" y1="284" x2="340" y2="284"/>
    </g>
    <text x="18" y="236" transform="rotate(-90 18 236)" text-anchor="middle" font-size="12">Action probe R² ↑</text>
    <g font-size="10" text-anchor="end"><text x="48" y="183">1.0</text><text x="48" y="235">0.75</text><text x="48" y="287">0.50</text></g>
    <rect x="74" y="224.3" width="41" height="59.7" fill="#d95c00"/>
    <rect x="143" y="221.2" width="41" height="62.8" fill="#087db6"/>
    <rect x="212" y="198.7" width="41" height="85.3" fill="#64a9a3"/>
    <rect x="281" y="195.2" width="41" height="88.8" fill="#225384"/>
    <g font-size="10" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="94.5" y="237">0.787</text><text x="163.5" y="234">0.802</text><text x="232.5" y="212">0.910</text><text x="301.5" y="208">0.927</text>
    </g>
    <g font-size="9.5" text-anchor="middle">
      <text x="94.5" y="297">z_t w/o JE Pred.</text><text x="163.5" y="297">z_t</text><text x="232.5" y="297">v_t</text><text x="301.5" y="297">z_t + v_t</text>
    </g>
  </g>
</svg>
